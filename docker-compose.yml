services:

  web:
    build: .
    expose:
      - "8000"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./staticfiles:/app/staticfiles
    env_file:
      - .env
    restart: unless-stopped

  lora-rx:
    build: .
    command: python lora_receiver.py
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
    #devices:
     # - "/dev/ttyACM0:/dev/ttyACM0" #comment out when not using a LoRa device
    restart: unless-stopped

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # NGINX_CONF (aus .env) wählt den Modus
      - ./${NGINX_CONF:-nginx.http.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      # Ganzes certs/-Verzeichnis mounten: im HTTP-Modus darf es leer sein, im HTTPS-Modus
      # liegen dort server.crt + server.key. So bricht der Start im HTTP-Modus nicht an
      # fehlenden Zertifikatsdateien.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
    restart: unless-stopped
