# Modus: NUR HTTP (Port 80). Kein TLS, keine Weiterleitung.
# Aktiviert über NGINX_CONF=nginx.http.conf in der .env.
server {
    listen 80;

    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $scheme ist hier "http" -> Django behandelt den Request als unverschlüsselt
        # (SECURE_PROXY_SSL_HEADER greift nur bei "https"). SECURE_COOKIES muss hier false sein.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
