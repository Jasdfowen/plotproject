server {
    listen 80;

    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $scheme ist hier "http" - sagt Django, dass diese Anfrage NICHT über TLS kam
        # (wichtig für SECURE_PROXY_SSL_HEADER in settings.py, siehe dortiger Kommentar).
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $scheme ist hier "https" - Django erfährt dadurch, dass TLS bei nginx endet,
        # obwohl intern per einfachem HTTP an gunicorn weitergereicht wird.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
