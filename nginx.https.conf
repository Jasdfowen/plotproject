# Modus: NUR HTTPS. Port 80 leitet jede Anfrage dauerhaft auf https um; die App
# wird ausschließlich über TLS (Port 443) bedient.
# Aktiviert über NGINX_CONF=nginx.https.conf in der .env.
# Voraussetzung: certs/server.crt + certs/server.key liegen vor. SECURE_COOKIES=true setzen.

# Port 80: alles Unverschlüsselte sofort per 301 auf https umleiten.
server {
    listen 80;
    return 301 https://$host$request_uri;
}

# Port 443: TLS-terminierter Server, der an gunicorn (web:8000) weiterreicht.
server {
    listen 443 ssl;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $scheme ist hier "https" -> zusammen mit SECURE_PROXY_SSL_HEADER erkennt Django TLS,
        # obwohl intern nur HTTP an gunicorn geht. Nötig, damit CSRF/Origin über https passt.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
